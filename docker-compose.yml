# Optional: a local PostgreSQL if you don't have one installed.  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agritrack
      POSTGRES_PASSWORD: agritrack
      POSTGRES_DB: agritrack
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
volumes:
  dbdata:
